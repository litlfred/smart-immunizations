<!DOCTYPE html>
<html lang="en">
  <head>
    <title>OpenAPI Documentation - DAK API</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css"
          href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
    <style>
      body { margin: 0; padding: 0; font-family: var(--fa-font-sans,system-ui,sans-serif); }
      /* Definition selector bar below the header */
      #definition-selector-bar {
        background-color: #0070a1;
        color: #ffffff;
        padding: 0.5rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.9rem;
        flex-wrap: wrap;
      }
      #definition-selector-bar label {
        font-weight: 600;
        white-space: nowrap;
      }
      #definition-select {
        font-size: 0.9rem;
        padding: 0.25rem 0.5rem;
        border-radius: 3px;
        border: 1px solid rgba(255,255,255,0.6);
        background-color: #ffffff;
        color: #00477d;
        min-width: 200px;
        max-width: 100%;
        flex: 1;
      }
      /* Hide Swagger UI topbar entirely */
      .swagger-ui .topbar {
        display: none;
      }
    </style>
  </head>
  <body>
  <!-- No header of its own: the site gives every page the IG's one bar. -->

  <div id="definition-selector-bar">
    <label for="definition-select">Select a definition:</label>
    <select id="definition-select" onchange="switchDefinition(this.value)">
    </select>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script>
  var swaggerUrls = [
  {
    "url": "../StructureDefinition-IMMZ_C4_Create_client_record.openapi.json",
    "name": "IMMZ.C4.Create client record"
  },
  {
    "url": "../StructureDefinition-IMMZ_D13_Update_client_record.openapi.json",
    "name": "IMMZ.D13.Update client record"
  },
  {
    "url": "../StructureDefinition-IMMZ_D17_Report_AEFI.openapi.json",
    "name": "IMMZ.D17.Report AEFI"
  },
  {
    "url": "../StructureDefinition-IMMZ_D18_Determine_time_for_next_visit.openapi.json",
    "name": "IMMZ.D18.Determine time for next visit"
  },
  {
    "url": "../StructureDefinition-IMMZ_D1_Capture_or_update_client_history.openapi.json",
    "name": "IMMZ.D1.Capture or update client history"
  },
  {
    "url": "../StructureDefinition-IMMZ_D20_Does_client_require_a_verifiable_digital_certificate.openapi.json",
    "name": "IMMZ.D20.Does client require a verifiable digital certificate"
  },
  {
    "url": "../StructureDefinition-IMMZ_D21_Generate_verifiable_digital_certificate.openapi.json",
    "name": "IMMZ.D21.Generate verifiable digital certificate"
  },
  {
    "url": "../StructureDefinition-IMMZ_D2_Determine_required_vaccination_s_.openapi.json",
    "name": "IMMZ.D2.Determine required vaccination(s)"
  },
  {
    "url": "../StructureDefinition-IMMZ_D5_Determine_vaccine_s__to_be_administered_based_on_contraindications.openapi.json",
    "name": "IMMZ.D5.Determine vaccine(s) to be administered based on contraindications"
  },
  {
    "url": "../StructureDefinition-IMMZ_D7_Counsel_client.openapi.json",
    "name": "IMMZ.D7.Counsel client"
  }
];
  var ui;
  window.onload = function() {
    var select = document.getElementById('definition-select');
    swaggerUrls.forEach(function(item, idx) {
      var opt = document.createElement('option');
      opt.value = item.url;
      opt.textContent = item.name;
      select.appendChild(opt);
    });
    ui = SwaggerUIBundle({
      url: "../StructureDefinition-IMMZ_C4_Create_client_record.openapi.json",
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout"
    });
  };
  function switchDefinition(url) {
    ui.specActions.updateUrl(url);
    ui.specActions.download(url);
  }
  </script>

  </body>
</html>
