# Build this IG's own site with the folio-assistant harness (smart-base), and
# publish it to this repository's gh-pages.
#
# The pages are this repository's own `input/pagecontent/` at the pushed
# commit, built by folio-assistant's `stage-ig-sites --only smart-immunizations
# --source .`: one just-the-docs site per IG, WHO's top bar kept, the
# folio-assistant navbar with the IG's TOC as its section, an edit link per
# page, and per heading a source-line link and a pre-filled feedback issue
# (folio-assistant bean mftp). The artefact pages and the menu come from the
# folio-assistant submodule's `smart-immunizations/` instance.
#
# The IG Publisher's GitHub Actions are not used in this fork; this workflow
# owns gh-pages.
name: folio site

on:
  push:
    branches: [main, claude/seed-smart-base]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folio-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2

      - name: Install folio-assistant
        working-directory: folio-assistant
        run: bun install --frozen-lockfile

      - name: Set up Ruby for the IG site
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: folio-assistant/cat-harness/docs

      - name: Stage the IG site from this checkout
        working-directory: folio-assistant
        run: |
          curl -sSfL -o "$RUNNER_TEMP/plantuml.jar" \
            https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/1.2024.7/plantuml-1.2024.7.jar
          # The work directory is OUTSIDE the checkout: the source copy is the
          # checkout, and a work directory inside it would copy itself.
          bun run fhir-harness/scripts/stage-ig-sites.ts --work "$RUNNER_TEMP/ig" --baseurl "" \
            --only smart-immunizations --source .. --plantuml-jar "$RUNNER_TEMP/plantuml.jar" > "$RUNNER_TEMP/ig-list.txt"
          cat "$RUNNER_TEMP/ig-list.txt"

      - name: Build the site
        run: |
          read -r INSTANCE SRC AT < "$RUNNER_TEMP/ig-list.txt"
          BUNDLE_GEMFILE="$PWD/folio-assistant/cat-harness/docs/Gemfile" bundle exec jekyll build \
            --source "$SRC" --destination ./_site
          bun run folio-assistant/fhir-harness/scripts/build-ig-site.ts --dedupe-ids ./_site
          # The served data the JSON and DAK views fetch (`../fhir-artifact-index/`).
          cp -a "folio-assistant/${INSTANCE}/fhir-artifact-index" ./_site/fhir-artifact-index
          touch ./_site/.nojekyll

      - name: Give every page the folio-assistant navbar
        working-directory: folio-assistant
        run: |
          bun run cat-harness/scripts/rail-standalone-pages.ts --site ../_site --built cat-harness \
            --foreign-site --home-label "WHO SMART Immunizations"

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/seed-smart-base'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          single-commit: true
